<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Pacifico&family=Space+Mono&family=Merriweather&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #1a1a1a;
      --text-color: #ffffff;
      --text-secondary: #cccccc;
      --border-color: #444;
      --focus-color: #666;
      --control-bg: rgba(255, 255, 255, 0.08);
      --control-hover: rgba(255, 255, 255, 0.12);
    }
    body.light-mode {
      --bg-color: #ffffff;
      --text-color: #1a1a1a;
      --text-secondary: #555555;
      --border-color: #d0d0d0;
      --focus-color: #e8e8e8;
      --control-bg: rgba(0, 0, 0, 0.04);
      --control-hover: rgba(0, 0, 0, 0.08);
    }
    * {
      box-sizing: border-box;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Space Mono', monospace;
      font-size: 16px;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s ease-out, color 0.3s ease-out;
      overflow: hidden;
    }
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: 80px;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.1;
      text-align: center;
      word-break: break-word;
      max-width: 90vw;
      transition: font-size 0.2s ease-out, font-family 0.2s ease-out;
    }
    .controls {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 16px;
      padding: 16px;
      background-color: var(--control-bg);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      z-index: 10;
    }
    .control-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.875rem;
    }
    .control-label {
      color: var(--text-secondary);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.7;
    }
    input[type="range"] {
      cursor: pointer;
      width: 120px;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--border-color);
      border-radius: 2px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--text-color);
      cursor: pointer;
      transition: background-color 0.2s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      background: var(--focus-color);
    }
    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--text-color);
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    input[type="range"]::-moz-range-thumb:hover {
      background: var(--focus-color);
    }
    select {
      padding: 8px 12px;
      font-size: 0.875rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    select:hover {
      background-color: var(--control-hover);
    }
    select:focus {
      outline: 2px solid var(--text-color);
      outline-offset: 2px;
    }
    button {
      font-family: inherit;
      padding: 8px 12px;
      font-size: 0.875rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    button:hover:not(:disabled) {
      background-color: var(--control-hover);
    }
    button:focus {
      outline: 2px solid var(--text-color);
      outline-offset: 2px;
    }
    button:active:not(:disabled) {
      transform: scale(0.98);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(2px);
      animation: fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    .modal.open {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background-color: var(--bg-color);
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      max-width: 400px;
      width: 90%;
      border: 1px solid var(--border-color);
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .modal-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.01em;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-color);
      padding: 4px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .close-btn:hover {
      background-color: var(--control-hover);
    }
    .close-btn:focus {
      outline: 2px solid var(--text-color);
      outline-offset: 2px;
    }
    .signin-option {
      padding: 12px 16px;
      margin: 12px 0;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: var(--bg-color);
      color: var(--text-color);
      text-align: center;
      font-size: 0.875rem;
      cursor: not-allowed;
      opacity: 0.6;
      transition: all 0.2s;
    }
    @media (max-width: 768px) {
      h1 {
        font-size: 48px;
        max-width: 100%;
        padding: 0 16px;
      }
      .controls {
        top: 12px;
        right: 12px;
        padding: 12px;
        gap: 12px;
      }
      .control-row {
        gap: 8px;
      }
      input[type="range"] {
        width: 80px;
      }
    }
    @media (max-width: 480px) {
      h1 {
        font-size: 36px;
      }
      .controls {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: flex-end;
        max-width: calc(100vw - 24px);
      }
      .control-row {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <canvas id="particleCanvas"></canvas>
  <h1 id="text">Hello World</h1>
  <div class="controls" role="toolbar" aria-label="Text and theme controls">
    <div class="control-row">
      <label for="fontSizeSlider" class="control-label">Size</label>
      <input type="range" id="fontSizeSlider" min="12" max="200" value="80" aria-label="Text size">
    </div>
    <div class="control-row">
      <label for="fontPicker" class="control-label">Font</label>
      <select id="fontPicker" aria-label="Font selection">
        <option value="Playfair Display">Playfair Display</option>
        <option value="Pacifico">Pacifico</option>
        <option value="Space Mono" selected>Space Mono</option>
        <option value="Merriweather">Merriweather</option>
      </select>
    </div>
    <div class="control-row">
      <button id="themeToggle" aria-label="Toggle dark and light mode">🌙 Dark Mode</button>
    </div>
    <div class="control-row">
      <button id="signinBtn" aria-label="Open sign in dialog">Sign In</button>
    </div>
  </div>
  <div id="signinModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Sign In</h2>
        <button class="close-btn" id="closeModal">&times;</button>
      </div>
      <button class="signin-option">🔵 Sign in with Google</button>
    </div>
  </div>
  <script>
    const text = document.getElementById('text');
    const fontSizeSlider = document.getElementById('fontSizeSlider');
    const fontPicker = document.getElementById('fontPicker');
    const themeToggle = document.getElementById('themeToggle');
    const signinBtn = document.getElementById('signinBtn');
    const signinModal = document.getElementById('signinModal');
    const closeModal = document.getElementById('closeModal');
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = [];
    const particleCount = 50;
    const repelDistance = 150;

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.2;
        this.vy = (Math.random() - 0.5) * 0.2;
        this.size = Math.random() * 2 + 1;
        this.angle = Math.random() * Math.PI * 2;
      }

      update() {
        this.angle += 0.01;
        const swirl = Math.sin(this.angle) * 0.05;
        this.vx += swirl;
        this.vy += Math.cos(this.angle) * 0.03;

        this.vx *= 0.98;
        this.vy *= 0.98;

        this.x += this.vx;
        this.y += this.vy;

        const textRect = text.getBoundingClientRect();
        const dx = this.x - (textRect.left + textRect.width / 2);
        const dy = this.y - (textRect.top + textRect.height / 2);
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < repelDistance) {
          const force = (repelDistance - distance) / repelDistance;
          const angle = Math.atan2(dy, dx);
          this.vx += Math.cos(angle) * force * 0.3;
          this.vy += Math.sin(angle) * force * 0.3;
        }

        if (this.x < 0) this.x = canvas.width;
        if (this.x > canvas.width) this.x = 0;
        if (this.y < 0) this.y = canvas.height;
        if (this.y > canvas.height) this.y = 0;
      }

      draw() {
        ctx.fillStyle = document.body.classList.contains('light-mode')
          ? `rgba(100, 100, 100, 0.6)`
          : `rgba(200, 200, 200, 0.6)`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initParticles() {
      particles.length = 0;
      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach(particle => {
        particle.update();
        particle.draw();
      });

      requestAnimationFrame(animate);
    }

    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.body.classList.toggle('light-mode', savedTheme === 'light');
      updateThemeButton();
    }

    function updateThemeButton() {
      const isLight = document.body.classList.contains('light-mode');
      themeToggle.textContent = isLight ? '☀️ Light Mode' : '🌙 Dark Mode';
    }

    function initText() {
      const savedFont = localStorage.getItem('font') || 'Space Mono';
      const savedSize = localStorage.getItem('fontSize') || '80';
      text.style.fontSize = savedSize + 'px';
      text.style.fontFamily = savedFont;
      fontPicker.value = savedFont;
      fontSizeSlider.value = savedSize;
    }

    fontSizeSlider.addEventListener('input', (e) => {
      const size = e.target.value;
      text.style.fontSize = size + 'px';
      localStorage.setItem('fontSize', size);
    });

    fontPicker.addEventListener('change', (e) => {
      const font = e.target.value;
      text.style.fontFamily = font;
      localStorage.setItem('font', font);
    });

    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      const newTheme = document.body.classList.contains('light-mode') ? 'light' : 'dark';
      localStorage.setItem('theme', newTheme);
      updateThemeButton();
    });

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    function openModal() {
      signinModal.classList.add('open');
      closeModal.focus();
    }

    function closeSigninModal() {
      signinModal.classList.remove('open');
      signinBtn.focus();
    }

    signinBtn.addEventListener('click', openModal);
    closeModal.addEventListener('click', closeSigninModal);

    signinModal.addEventListener('click', (e) => {
      if (e.target === signinModal) {
        closeSigninModal();
      }
    });

    signinModal.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeSigninModal();
      }
    });

    initTheme();
    initText();
    initParticles();
    animate();
  </script>
</body>
</html>
